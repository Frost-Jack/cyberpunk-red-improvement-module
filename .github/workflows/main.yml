name: Validate and build module

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to upload (leave empty for build only)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test advancement and sheet integration
        run: npm test
      - name: Test release tags and packaged manifests
        run: python -m unittest discover -s tests -p '*_test.py'
      - name: Build archive and manifest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python tools/build.py --tag "$RELEASE_TAG"
          else
            python tools/build.py
          fi
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cyberpunk-red-improvement-module
          path: dist/
      - name: Attach files to selected GitHub release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" dist/module.json dist/module.zip --clobber
