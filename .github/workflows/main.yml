# Based on the original League of Foundry Developers release template.
name: Create Module Files For GitHub Release

env:
  project_url: "https://github.com/${{ github.repository }}"
  latest_manifest_url: "https://github.com/${{ github.repository }}/releases/latest/download/module.json"
  release_module_url: "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/module.zip"

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Extract Version From Tag
        id: get_version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: echo "version-without-v=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      # Keep the checked-in manifest usable in local Foundry installations.
      - name: Prepare Manifest Tokens
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync("module.json", "utf8"));
          manifest.version = "#{VERSION}#";
          manifest.url = "#{URL}#";
          manifest.manifest = "#{MANIFEST}#";
          manifest.download = "#{DOWNLOAD}#";
          fs.writeFileSync("module.json", JSON.stringify(manifest, null, 2) + "\n");
          NODE

      - name: Modify Module Manifest With Release-Specific Values
        uses: cschleiden/replace-tokens@v1
        with:
          files: 'module.json'
        env:
          VERSION: ${{ steps.get_version.outputs.version-without-v }}
          URL: ${{ env.project_url }}
          MANIFEST: ${{ env.latest_manifest_url }}
          DOWNLOAD: ${{ env.release_module_url }}

      - name: Create Module Archive
        run: zip --recurse-paths ./module.zip module.json README.md LICENSE scripts/ styles/ languages/

      - name: Update Release With Files
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: ${{ github.event.release.name }}
          draft: ${{ github.event.release.unpublished }}
          prerelease: ${{ github.event.release.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: './module.json, ./module.zip'
          tag: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}
